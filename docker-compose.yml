services:
  wishlist:
    image: ghcr.io/butthe4d/wish-list:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Required. Public URL of the app, used in every link the app creates.
      BASE_URL: https://wish.example.com
      # Required, at least 32 characters. Put it in a .env file next to this one (SECRET_KEY=...).
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # The first admin is created on first start; their personal link is printed in the container log.
      ADMIN_EMAIL: you@example.com
      ADMIN_NAME: You
      DEFAULT_LANGUAGE: en   # en or pl

      # Optional email (example: Gmail with an app password)
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_SECURITY: starttls   # starttls, ssl or none
      # SMTP_USER: you@gmail.com
      # SMTP_PASSWORD: your-16-char-app-password
      # SMTP_FROM: you@gmail.com

      # Optional SMS via gsmservice.pl
      # GSMSERVICE_TOKEN: your-token
      # GSMSERVICE_SENDER: Wishlist

      # Optional: networks the server must never fetch item pictures from (comma or space separated).
      # List your LAN's global IPv6 prefix and your public IPv4/DDNS address; see the README.
      # FETCH_DENY_CIDRS: "2001:db8:1234::/48, 203.0.113.7/32"
